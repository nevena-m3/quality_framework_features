[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper1-remote-speech-qc"
version = "0.10.2"
description = "Auditable quality-control measurement pipeline for remote ALS speech recordings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<0.15",
  "soundfile>=0.12,<0.14",
  "PyYAML>=6.0,<7",
  "openpyxl>=3.1,<4",
  "pyarrow>=15,<23",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "tqdm>=4.66,<5",
  "ipywidgets>=8.1,<9",
  "silero-vad==6.2.1",
  "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "jupyterlab>=4,<5", "nbclient>=0.10,<0.11"]
reverb = ["gammatone==1.0.3"]

[project.scripts]
paper1-qc = "paper1_qc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
