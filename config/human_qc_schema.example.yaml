# Copy to config/human_qc_schema.yaml and review every mapping before Goal 4.
#
# Expected local layout:
# Bamboo_passage_HumanQC/
#   Abbas/   # distributed main ratings: different recordings per RA
#   Liya/
#   Samaana/
#   Samara/
#   Reliability/
#     Abbas/ # the same approximately 70 recordings independently rated by all 4 RAs
#     Liya/
#     Samaana/
#     Samara/
#
# The main and Reliability folders are deliberately analyzed as different designs.
# Never pool the main files as though every recording had four ratings.
format: interval_json
rating_design: distributed_with_crossed_reliability
rater_strategy: parent_directory
rater_directory_names: [Abbas, Liya, Samaana, Samara]
reliability_subdirectory: Reliability
expected_raters: 4
minimum_primary_ratings: 4
minimum_sensitivity_ratings: 3
interval_time_base: absolute

# Perceptual family mapping. "Any non-task related content" and "Competing speech"
# are retained for audit but excluded from primary family alignment.
family_map:
  Environmental noise: additive_interference
  Volume unstable: gain_dynamics
  Reverberation/echo: reverberation_tail
  Platform effects: channel_device
  Clipping: nonlinear_distortion
  Temporal discontinuities: temporal_discontinuity

context_columns:
  Any non-task related content: task_content_contamination
  Competing speech: competing_speech_context

# Feature-level links are secondary. The primary Goal 4 estimand uses the
# direction-oriented family indices constructed from the frozen metric registry.
perceptual_metric_map:
  additive_interference:
    - qadd_nonspeech_level_dbfs
    - qadd_snr_proxy_db
    - qadd_nonspeech_variability_db
    - qadd_hum_prominence_db
    - qadd_transient_rate_per_min
  gain_dynamics:
    - qgain_level_iqr_db
    - qgain_segment_sd_db
    - qgain_abs_drift_db_per_min
  reverberation_tail:
    - qrev_tail_excess_db
    - qrev_decay_time_proxy_sec
  channel_device:
    - qchan_effective_bandwidth_hz
  nonlinear_distortion:
    - qdist_hard_clip_sample_fraction
    - qdist_clip_event_rate_per_min
    - qdist_clipped_frame_fraction
  temporal_discontinuity:
    - qtemp_zero_dropout_fraction
    - qtemp_zero_dropout_rate_per_min
    - qtemp_duplicate_window_rate_per_min

# These are merged metadata fields produced by a different two-RA workflow.
# The individual two-RA decisions are not available in the metadata, so their
# inter-rater reliability cannot be estimated. Only overlapping families can be
# compared fairly with the detailed 4RA system.
broad_metadata:
  direction_confirmed: false
  absent_value: No
  present_value: Yes
  family_columns:
    additive_interference: Background Noise
    gain_dynamics: Volume is Unstable
